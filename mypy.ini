[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_unused_ignores = False
check_untyped_defs = False
no_implicit_optional = True

# Third-party stubs for OpenCV/Pillow lag their runtime APIs (e.g. Image.BILINEAR, cv2.ORB_create).
[mypy-cv2.*]
follow_imports = skip
follow_untyped_imports = False
[mypy-PIL.*]
follow_imports = skip
