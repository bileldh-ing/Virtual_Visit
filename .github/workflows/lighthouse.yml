name: lighthouse
on:
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/lighthouse.yml", "lighthouserc.json"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lhci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 12.14.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - name: Build
        working-directory: apps/web
        env: { NEXT_TELEMETRY_DISABLED: "1" }
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
      - name: Lighthouse CI (landing + auth pages)
        run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.json
