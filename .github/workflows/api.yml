name: api
on:
  push:
    branches: [main]
    paths: ["services/**", "tests/**", "ruff.toml", "mypy.ini", ".github/workflows/api.yml"]
  pull_request:
    paths: ["services/**", "tests/**", "ruff.toml", "mypy.ini", ".github/workflows/api.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - name: Ruff
        run: ruff check .
      - name: Mypy (recon library, strict-optional)
        run: |
          pip install numpy pillow opencv-python-headless types-requests
          mypy --config-file mypy.ini services/reconstruction/roomscape_recon

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: roomscape
          POSTGRES_PASSWORD: roomscape
          POSTGRES_DB: roomscape_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roomscape" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/*/pyproject.toml
      - name: Install
        run: |
          pip install -e services/reconstruction -e "services/api[dev]" -e services/worker
      - name: Unit tests
        run: pytest tests/unit -q --cov=services --cov-report=xml:coverage-unit.xml
      - name: Integration tests (PostgreSQL + Alembic migrations)
        env:
          ROOMSCAPE_TEST_DATABASE_URL: postgresql+psycopg://roomscape:roomscape@localhost:5432/roomscape_test
        run: pytest tests/integration -q -k "not colmap" --cov=services --cov-append --cov-report=xml:coverage.xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: coverage*.xml
