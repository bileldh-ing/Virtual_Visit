name: e2e
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: roomscape, POSTGRES_PASSWORD: roomscape, POSTGRES_DB: roomscape }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U roomscape" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ROOMSCAPE_ENV: development
      ROOMSCAPE_DATABASE_URL: postgresql+psycopg://roomscape:roomscape@localhost:5432/roomscape
      ROOMSCAPE_REDIS_URL: redis://localhost:6379/0
      ROOMSCAPE_SECRET_KEY: ci-e2e-secret-key-0123456789abcdef
      ROOMSCAPE_STORAGE_BACKEND: local
      ROOMSCAPE_STORAGE_LOCAL_ROOT: ${{ github.workspace }}/.data/storage
      ROOMSCAPE_WORKER_WORKSPACE: ${{ github.workspace }}/.data/jobs
      ROOMSCAPE_PUBLIC_WEB_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: services/*/pyproject.toml }
      - uses: pnpm/action-setup@v4
        with: { version: 12.14.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - name: Install API + worker
        run: pip install -e services/reconstruction -e services/api -e services/worker
      - name: Start API and worker
        run: |
          mkdir -p .data
          cd services/api && python -m roomscape_api.migrate && cd ../..
          nohup uvicorn roomscape_api.main:app --port 8000 > .data/api.log 2>&1 &
          nohup roomscape-worker > .data/worker.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/readyz && break; sleep 1; done
      - name: Build and start web
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
          ROOMSCAPE_E2E_FIXTURES=1 ROOMSCAPE_API_INTERNAL_URL=http://localhost:8000 PORT=3000 nohup node .next/standalone/server.js > ../../.data/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
      - name: Install browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: apps/web
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            .data/*.log
