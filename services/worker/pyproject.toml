[project]
name = "roomscape-worker"
version = "0.1.0"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["roomscape-api", "roomscape-recon", "rq>=2.0", "redis>=5"]

[project.scripts]
roomscape-worker = "roomscape_worker.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["roomscape_worker*"]
