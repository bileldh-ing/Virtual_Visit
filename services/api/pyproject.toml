[project]
name = "roomscape-api"
version = "0.1.0"
description = "RoomScape AI product API"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0.30", "alembic>=1.13", "psycopg[binary]>=3.2",
  "pydantic[email]>=2.7", "pydantic-settings>=2.3", "argon2-cffi>=23.1", "python-multipart>=0.0.9",
  "redis>=5", "rq>=2.0", "boto3>=1.34", "httpx>=0.27", "pillow>=10.3", "numpy>=1.26", "roomscape-recon",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["roomscape_api*"]

[tool.setuptools.package-data]
roomscape_api = ["migrations/*", "migrations/versions/*", "alembic.ini"]
